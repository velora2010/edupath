```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduPath | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #f5f7f5;
    --card: #ffffff;
    --text: #172321;
    --muted: #687772;
    --green: #1f5b4e;
    --green-dark: #16473d;
    --mint: #dcebe1;
    --coral: #ed765d;
    --line: #dce3df;
    --shadow: 0 20px 60px rgba(31,91,78,.12);
}

body.dark {
    --bg: #101917;
    --card: #17231f;
    --text: #f2f7f4;
    --muted: #9eaea8;
    --line: #2a3934;
    --mint: #203d34;
    --shadow: 0 20px 60px rgba(0,0,0,.3);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 10% 10%, var(--mint), transparent 30%),
        var(--bg);

    color: var(--text);
    font-family: "DM Sans", sans-serif;

    display: flex;
    flex-direction: column;

    transition: .3s;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input {
    font-family: inherit;
}


/* NAVBAR */

.navbar {
    height: 76px;

    border-bottom: 1px solid var(--line);

    background: var(--card);
}

.nav-inner {
    width: min(1100px, calc(100% - 30px));
    height: 100%;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -.05em;
}

.logo span {
    color: var(--coral);
}

.nav-actions {
    display: flex;
    gap: 10px;
}

.theme-btn {
    width: 40px;
    height: 40px;

    border: 1px solid var(--line);
    border-radius: 50%;

    background: var(--card);
    color: var(--text);

    cursor: pointer;
}


/* LOGIN */

.page {
    flex: 1;

    display: grid;
    place-items: center;

    padding: 50px 20px;
}

.login-card {
    width: min(440px, 100%);

    background: var(--card);

    border: 1px solid var(--line);

    border-radius: 28px;

    padding: 40px;

    box-shadow: var(--shadow);
}

.icon {
    width: 58px;
    height: 58px;

    display: grid;
    place-items: center;

    border-radius: 17px;

    background: var(--mint);

    font-size: 1.6rem;
}

h1 {
    margin: 20px 0 8px;

    font-family: "Fraunces", serif;

    font-size: 2.7rem;

    letter-spacing: -.05em;
}

.subtitle {
    margin: 0 0 28px;

    color: var(--muted);

    line-height: 1.5;
}


/* FORM */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    margin-bottom: 7px;

    font-size: .85rem;
    font-weight: 700;
}

.input-wrapper {
    position: relative;
}

input {
    width: 100%;

    padding: 14px 15px;

    border: 1px solid var(--line);

    border-radius: 12px;

    outline: none;

    background: var(--bg);

    color: var(--text);

    font-size: .95rem;

    transition: .2s;
}

input:focus {
    border-color: var(--green);

    box-shadow:
        0 0 0 3px rgba(31,91,78,.10);
}

.password-toggle {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    border: 0;

    background: transparent;

    cursor: pointer;

    font-size: 1rem;
}


/* OPTIONS */

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 5px 0 22px;

    font-size: .8rem;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;

    color: var(--muted);
}

.remember input {
    width: auto;
}

.forgot {
    color: var(--green);
    font-weight: 700;
}


/* BUTTON */

.login-btn {
    width: 100%;

    padding: 15px;

    border: 0;

    border-radius: 12px;

    background: var(--green);

    color: white;

    font-size: .95rem;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.login-btn:hover {
    background: var(--green-dark);

    transform: translateY(-2px);
}


/* MESSAGE */

.message {
    min-height: 22px;

    margin-top: 15px;

    text-align: center;

    font-size: .85rem;

    font-weight: 600;
}

.message.error {
    color: var(--coral);
}


/* REGISTER */

.register {
    margin-top: 25px;

    padding-top: 22px;

    border-top: 1px solid var(--line);

    text-align: center;

    color: var(--muted);

    font-size: .85rem;
}

.register a {
    color: var(--green);

    font-weight: 700;
}


/* FOOTER */

footer {
    padding: 25px;

    text-align: center;

    color: var(--muted);

    font-size: .75rem;
}


/* MOBILE */

@media(max-width:500px) {

    .login-card {
        padding: 28px 22px;
        border-radius: 22px;
    }

    h1 {
        font-size: 2.3rem;
    }

}

</style>
</head>


<body>


<header class="navbar">

<div class="nav-inner">

<a href="index.html" class="logo">
Edu<span>Path</span>
</a>

<div class="nav-actions">

<button
class="theme-btn"
id="themeBtn">
🌙
</button>

</div>

</div>

</header>


<main class="page">


<div class="login-card">


<div class="icon">
🎓
</div>


<h1>
Welcome back.
</h1>


<p class="subtitle">
Log in to continue your journey toward your dream university.
</p>


<form id="loginForm">


<div class="form-group">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="you@example.com"
required>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<div class="input-wrapper">

<input
type="password"
id="password"
placeholder="Enter your password"
required
minlength="6">

<button
type="button"
class="password-toggle"
id="togglePassword">
👁️
</button>

</div>

</div>


<div class="options">

<label class="remember">

<input
type="checkbox"
id="remember">

Remember me

</label>


<a href="#"
class="forgot"
onclick="forgotPassword(event)">
Forgot password?
</a>

</div>


<button
type="submit"
class="login-btn">

Log in →

</button>


<div
class="message"
id="message">
</div>


</form>


<div class="register">

Don't have an account?

<a href="register.html">
Create one
</a>

</div>


</div>

</main>


<footer>

© 2026 EduPath · Your future is in progress.

</footer>


<script>

/* =========================
   PASSWORD VISIBILITY
========================= */

const password =
document.getElementById("password");

const togglePassword =
document.getElementById("togglePassword");

togglePassword.addEventListener("click", function(){

if(password.type === "password"){

password.type = "text";

togglePassword.textContent = "🙈";

}else{

password.type = "password";

togglePassword.textContent = "👁️";

}

});


/* =========================
   LOGIN
========================= */

const loginForm =
document.getElementById("loginForm");

const message =
document.getElementById("message");

loginForm.addEventListener("submit", function(event){

event.preventDefault();

const email =
document.getElementById("email").value.trim();

const passwordValue =
document.getElementById("password").value;


/*
    Demo login.

    Keyinchalik buni haqiqiy
    authentication tizimiga ulaymiz.
*/

const savedUser =
JSON.parse(localStorage.getItem("edupath-user"));


if(savedUser){

if(
savedUser.email === email &&
savedUser.password === passwordValue
){

localStorage.setItem(
"edupath-logged-in",
"true"
);

window.location.href =
"dashboard.html";

}else{

message.textContent =
"Email or password is incorrect.";

message.className =
"message error";

}

}else{

/*
    Agar hali account yaratilmagan
    bo'lsa, register sahifasiga o'tish.
*/

message.innerHTML =
'No account found. <a href="register.html">Create an account</a>';

message.className =
"message error";

}

});


/* =========================
   FORGOT PASSWORD
========================= */

function forgotPassword(event){

event.preventDefault();

alert(
"Password recovery will be added in the next version."
);

}


/* =========================
   DARK MODE
========================= */

const themeButton =
document.getElementById("themeBtn");

const savedTheme =
localStorage.getItem("edupath-theme");

if(savedTheme === "dark"){

document.body.classList.add("dark");

themeButton.textContent =
"☀️";

}


themeButton.addEventListener("click", function(){

document.body.classList.toggle("dark");

const dark =
document.body.classList.contains("dark");

themeButton.textContent =
dark ? "☀️" : "🌙";

localStorage.setItem(
"edupath-theme",
dark ? "dark" : "light"
);

});

</script>


</body>
</html>
```
